name: Build Aldi Croptop APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Find and extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -printf '%f\n' | sort | tail -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Tidak ada file ZIP di folder utama repository. Unggah Aldi_Croptop_Futuristik_Fixed.zip ke folder utama."
            exit 1
          fi
          echo "Menggunakan file: $ZIP_FILE"
          mkdir -p source
          unzip -q "$ZIP_FILE" -d source
          if [ ! -f source/settings.gradle.kts ] && [ ! -f source/settings.gradle ]; then
            echo "::error::ZIP berhasil diekstrak, tetapi settings.gradle(.kts) tidak ditemukan di folder utama hasil ekstrak."
            echo "Isi folder hasil ekstrak:"
            find source -maxdepth 3 -type f | head -80
            exit 1
          fi

      - name: Build debug APK
        run: gradle -p source assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aldi-Croptop-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
